services:
  localstack:
    container_name: localstack_storage_engine
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - PERSISTENCE=1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "./localstack_storage_data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"